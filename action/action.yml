name: 'Nori Package'
description: 'Package and push Terraform/OpenTofu modules as OCI artifacts'
author: 'eunanio'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  registry:
    description: 'OCI registry hostname (e.g., ghcr.io, docker.io)'
    required: true
  repository:
    description: 'Repository path within the registry (e.g., myorg/my-module)'
    required: true
  tag:
    description: 'Version tag for the module (e.g., v1.0.0, latest)'
    required: true
  module-path:
    description: 'Path to module archive (.zip, .tar.gz) or directory to package'
    required: true
  description:
    description: 'Module description to include in OCI annotations'
    required: false
    default: ''
  annotations:
    description: 'Custom OCI annotations as JSON object (e.g., {"key": "value"})'
    required: false
    default: '{}'
  insecure:
    description: 'Allow insecure (HTTP) registry connections'
    required: false
    default: 'false'
  sign:
    description: 'Sign the artifact using a signing key'
    required: false
    default: 'false'
  sign-key:
    description: 'Base64-encoded signing key content (use secrets to store)'
    required: false
    default: ''
  sign-password:
    description: 'Password for the signing key (use secrets to store)'
    required: false
    default: ''
  username:
    description: 'Registry username (auto-detected for GHCR using github.actor)'
    required: false
    default: ''
  token:
    description: 'Registry token/password for authentication (auto-detected for GHCR)'
    required: false
    default: ''

outputs:
  reference:
    description: 'Full OCI reference of the pushed artifact (registry/repository:tag)'
  digest:
    description: 'SHA256 digest of the pushed artifact'
  signed:
    description: 'Whether the artifact was signed (true/false)'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ github.token }}
    NORI_REGISTRY_USERNAME: ${{ inputs.username }}
    NORI_REGISTRY_PASSWORD: ${{ inputs.token }}
    NORI_SIGN_KEY: ${{ inputs.sign-key }}
    NORI_SIGN_PASSWORD: ${{ inputs.sign-password }}
  args:
    - ${{ inputs.registry }}
    - ${{ inputs.repository }}
    - ${{ inputs.tag }}
    - ${{ inputs.module-path }}
    - ${{ inputs.description }}
    - ${{ inputs.annotations }}
    - ${{ inputs.insecure }}
    - ${{ inputs.sign }}

